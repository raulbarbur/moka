# Gradle
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official

# Android
# AGP 9 desactiva el combo clasico com.android.* + plugin Kotlin Multiplatform;
# estas dos propiedades restauran el comportamiento de AGP 8 mientras el
# ecosistema KMP/Compose migra al nuevo plugin com.android.kotlin.multiplatform.*.
# (Mensaje de AGP: "set android.builtInKotlin=false and android.newDsl=false
# to temporarily bypass this issue".)
android.builtInKotlin=false
android.newDsl=false
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
